<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Đánh giá dịch vụ</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
  }

  body {
    padding:
      calc(24px + env(safe-area-inset-top, 0px))
      20px
      calc(24px + env(safe-area-inset-bottom, 0px))
      20px;

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;

    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #1c1c1e);
  }

  .container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  .icon {
    text-align: center;
    font-size: 40px;
    margin-bottom: 4px;
  }

  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 8px;
  }

  .description {
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    color: var(--tg-theme-hint-color, #8e8e93);
    margin: 0 0 28px;
  }

  .stars {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px;
  }

  .star {
    font-size: 38px;
    line-height: 1;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 6px;

    filter: grayscale(1);
    opacity: 0.4;

    transition:
      transform 0.15s ease,
      opacity 0.15s ease,
      filter 0.15s ease;
  }

  .star.selected {
    filter: grayscale(0);
    opacity: 1;
  }

  .star:active {
    transform: scale(0.9);
  }

  .score-label {
    text-align: center;
    font-size: 13px;
    color: var(--tg-theme-hint-color, #8e8e93);
    min-height: 18px;
    margin-bottom: 24px;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--tg-theme-hint-color, #8e8e93);
  }

  textarea {
    width: 100%;
    min-height: 110px;
    padding: 12px 14px;
    border-radius: 12px;

    border: 1px solid var(--tg-theme-hint-color, #d1d1d6);

    font-size: 16px;
    font-family: inherit;

    resize: vertical;

    background: var(--tg-theme-secondary-bg-color, #f2f2f7);
    color: var(--tg-theme-text-color, #1c1c1e);

    outline: none;
  }

  textarea:focus {
    border-color: var(--tg-theme-link-color, #2481cc);
  }

  textarea::placeholder {
    color: var(--tg-theme-hint-color, #8e8e93);
  }

  button.submit {
    width: 100%;
    margin-top: 22px;
    padding: 15px;

    border: none;
    border-radius: 12px;

    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;
  }

  button.submit:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .error-msg {
    text-align: center;
    font-size: 13px;
    color: #e53935;
    margin-top: 10px;
    min-height: 16px;
  }

  /* SUCCESS SCREEN */

  .success-screen {
    display: none;
    text-align: center;
    padding-top: 60px;
  }

  .success-screen .icon {
    font-size: 56px;
  }

  .success-screen h1 {
    margin-top: 8px;
  }

  /* ALREADY SUBMITTED SCREEN */

  .already-screen {
    display: none;
    text-align: center;
    padding-top: 60px;
  }

  .already-screen .icon {
    font-size: 56px;
  }

  .already-screen h1 {
    margin-top: 8px;
  }
</style>
</head>

<body>

<!-- =========================
     FORM ĐÁNH GIÁ
========================= -->

<div class="container" id="formScreen">

  <div class="icon">⭐</div>

  <h1>Đánh giá dịch vụ</h1>

  <p class="description">
    Bạn hài lòng với dịch vụ hỗ trợ khách hàng của chúng tôi ở mức nào?
  </p>

  <div class="stars" id="stars">

    <button class="star" data-score="1">⭐</button>
    <button class="star" data-score="2">⭐</button>
    <button class="star" data-score="3">⭐</button>
    <button class="star" data-score="4">⭐</button>
    <button class="star" data-score="5">⭐</button>

  </div>

  <div class="score-label" id="scoreLabel"></div>

  <label for="feedback">
    Cảm nhận thêm (không bắt buộc)
  </label>

  <textarea
    id="feedback"
    placeholder="Điều gì khiến bạn hài lòng hoặc chưa hài lòng?"
  ></textarea>

  <button
    id="submitButton"
    class="submit"
    onclick="submitFeedback()"
  >
    Gửi đánh giá
  </button>

  <div class="error-msg" id="errorMsg"></div>

</div>


<!-- =========================
     SUCCESS SCREEN
========================= -->

<div class="container success-screen" id="successScreen">

  <div class="icon" id="successIcon">✅</div>

  <h1 id="successTitle">
    Cảm ơn bạn!
  </h1>

  <p class="description" id="successDescription">
    Đánh giá của bạn đã được ghi nhận.
  </p>

</div>


<!-- =========================
     ALREADY SUBMITTED
========================= -->

<div class="container already-screen" id="alreadyScreen">

  <div class="icon">✅</div>

  <h1>Bạn đã gửi đánh giá</h1>

  <p class="description">
    Cảm ơn bạn đã dành thời gian chia sẻ trải nghiệm của mình.
  </p>

</div>


<script>

/* ==========================================
   TELEGRAM MINI APP
========================================== */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* ==========================================
   N8N WEBHOOK
========================================== */

const N8N_WEBHOOK_URL =
  "https://dbg9.app.n8n.cloud/webhook-test/677803e5-7722-450b-8895-39d98368dade";


/* ==========================================
   SCORE LABELS
========================================== */

const SCORE_LABELS = {

  1: "Rất không hài lòng",

  2: "Không hài lòng",

  3: "Bình thường",

  4: "Hài lòng",

  5: "Rất hài lòng"

};


/* ==========================================
   TELEGRAM USER
========================================== */

const user = tg.initDataUnsafe?.user || {};

const telegramChatId =
  user.id ? String(user.id) : "";

const telegramUsername =
  user.username ? String(user.username) : "";

const firstName =
  user.first_name ? String(user.first_name) : "";

const lastName =
  user.last_name ? String(user.last_name) : "";


/* ==========================================
   FEEDBACK TOKEN
========================================== */

/*
  Token được n8n tạo trước khi gửi link cho khách.

  Ví dụ:
  https://your-mini-app.com/?token=abc123...

  Token KHÔNG được tạo trong HTML.
  HTML chỉ đọc token từ URL và gửi token
  cùng Telegram ID về n8n để kiểm tra.

  Không dùng localStorage để xác định quyền
  đánh giá nữa. Việc kiểm tra quyền và
  đánh giá 1 lần/tháng được thực hiện ở n8n.
*/

const urlParams =
  new URLSearchParams(window.location.search);

const feedbackToken =
  urlParams.get("token") || "";


/* ==========================================
   KIỂM TRA THÔNG TIN ĐẦU VÀO
========================================== */

/*
  Nếu không có Telegram ID hoặc token,
  không cho khách gửi đánh giá.
*/

if (!telegramChatId || !feedbackToken) {

  document.getElementById("formScreen").style.display = "none";

  document.getElementById("alreadyScreen").style.display = "block";

  const alreadyTitle =
    document.querySelector("#alreadyScreen h1");

  const alreadyDescription =
    document.querySelector("#alreadyScreen .description");

  alreadyTitle.textContent =
    "Link đánh giá không hợp lệ";

  alreadyDescription.textContent =
    "Vui lòng sử dụng link đánh giá được gửi trực tiếp cho bạn.";

}


/* ==========================================
   STAR RATING
========================================== */

let selectedScore = 0;

const stars =
  document.querySelectorAll(".star");

const scoreLabel =
  document.getElementById("scoreLabel");


stars.forEach(star => {

  star.addEventListener("click", () => {

    selectedScore =
      Number(star.dataset.score);

    stars.forEach(s => {

      s.classList.toggle(
        "selected",
        Number(s.dataset.score) <= selectedScore
      );

    });

    scoreLabel.textContent =
      SCORE_LABELS[selectedScore] || "";

    if (tg.HapticFeedback) {

      tg.HapticFeedback.impactOccurred("light");

    }

  });

});


/* ==========================================
   SUBMIT FEEDBACK
========================================== */

async function submitFeedback() {

  const errorMsg =
    document.getElementById("errorMsg");

  errorMsg.textContent = "";


  /* Không cho gửi nếu chưa chọn sao */

  if (selectedScore === 0) {

    errorMsg.textContent =
      "Vui lòng chọn số sao trước khi gửi.";

    return;

  }


  /* ========================================
     LẤY FEEDBACK
  ======================================== */

  const feedback =
    document.getElementById("feedback")
      .value
      .trim();


  const submitButton =
    document.getElementById("submitButton");


  submitButton.disabled = true;

  submitButton.innerText =
    "Đang gửi...";


  /* ========================================
     THÔNG TIN USER TELEGRAM
  ======================================== */

  const telegramUsername =
    user.username
      ? String(user.username)
      : "";

  const firstName =
    user.first_name
      ? String(user.first_name)
      : "";

  const lastName =
    user.last_name
      ? String(user.last_name)
      : "";


  /* ========================================
     DATA GỬI SANG N8N
  ======================================== */

  const data = {

    score: selectedScore,

    feedback: feedback,

    telegram_chat_id: telegramChatId,

    telegram_username: telegramUsername,

    customer_name:
      `${firstName} ${lastName}`.trim(),

    submitted_at:
      new Date().toISOString(),

    feedback_token: feedbackToken

  };


  try {

    /* ======================================
       GỬI DATA SANG N8N
    ====================================== */

    /*
      n8n phải kiểm tra:
      1. Token có hợp lệ với Telegram ID + năm + tháng không
      2. Khách đã đánh giá trong tháng đó chưa
      3. Khách có được cấp link đánh giá hay không

      Chỉ khi n8n xác nhận hợp lệ mới ghi Google Sheet.
    */

    const response =
      await fetch(
        N8N_WEBHOOK_URL,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(data)
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "N8N Error:",
        errorText
      );

      throw new Error(
        `N8N trả về lỗi ${response.status}`
      );

    }


    /* ======================================
       THAY ĐỔI NỘI DUNG SAU KHI GỬI
    ====================================== */

    const successIcon =
      document.getElementById("successIcon");

    const successTitle =
      document.getElementById("successTitle");

    const successDescription =
      document.getElementById(
        "successDescription"
      );


    /*
      1–3 SAO
    */

    if (selectedScore <= 3) {

      successIcon.textContent = "💙";

      successTitle.textContent =
        "Rất tiếc vì trải nghiệm chưa tốt";

      successDescription.textContent =
        "Đánh giá của bạn đã được ghi nhận. " +
        "Chúng tôi sẽ xem xét phản hồi của bạn " +
        "để cải thiện chất lượng dịch vụ.";

    }


    /*
      4–5 SAO
    */

    else {

      successIcon.textContent = "💚";

      successTitle.textContent =
        "Cảm ơn bạn!";

      successDescription.textContent =
        "Đánh giá của bạn đã được ghi nhận. " +
        "Cảm ơn bạn đã dành thời gian chia sẻ!";

    }


    /* ======================================
       ẨN FORM
    ====================================== */

    document.getElementById(
      "formScreen"
    ).style.display = "none";


    /* ======================================
       HIỆN SUCCESS
    ====================================== */

    document.getElementById(
      "successScreen"
    ).style.display = "block";


    /* ======================================
       TELEGRAM HAPTIC
    ====================================== */

    if (tg.HapticFeedback) {

      tg.HapticFeedback
        .notificationOccurred("success");

    }


    /* ======================================
       ĐÓNG MINI APP
    ====================================== */

    setTimeout(() => {

      tg.close();

    }, 2500);


  } catch (error) {

    console.error(
      "Submit error:",
      error
    );


    errorMsg.textContent =
      "Không thể gửi đánh giá. Vui lòng thử lại.";


    submitButton.disabled = false;

    submitButton.innerText =
      "Gửi đánh giá";

  }

}

</script>

</body>
</html>
